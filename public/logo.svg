<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 80" width="320" height="80">
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="3" dy="3" stdDeviation="0" flood-color="#231B15" />
    </filter>
  </defs>
  <!-- Background Badge / Pill -->
  <rect x="6" y="8" width="308" height="64" rx="20" fill="#FAF3E0" stroke="#231B15" stroke-width="3.5" filter="url(#shadow)"/>
  <!-- Left retro diner mascot icon / burger & starburst -->
  <g transform="translate(18, 16)">
    <circle cx="24" cy="24" r="22" fill="#E9B44C" stroke="#231B15" stroke-width="3"/>
    <!-- Burger motif -->
    <path d="M12 22 Q24 12 36 22 Z" fill="#D9532F" stroke="#231B15" stroke-width="2.5"/>
    <rect x="11" y="24" width="26" height="4" rx="2" fill="#588157" stroke="#231B15" stroke-width="2"/>
    <path d="M12 29 Q24 35 36 29 Z" fill="#E2843A" stroke="#231B15" stroke-width="2.5"/>
    <!-- Small star sparkle -->
    <path d="M38 10 L39.5 14 L43.5 15.5 L39.5 17 L38 21 L36.5 17 L32.5 15.5 L36.5 14 Z" fill="#D9532F"/>
  </g>
  <!-- Brand text -->
  <text x="76" y="38" font-family="'Cooper Black', 'Bricolage Grotesque', cursive, fantasy, sans-serif" font-size="25" font-weight="900" fill="#D9532F" stroke="#231B15" stroke-width="1.5" letter-spacing="0.5">CHOW CHOW</text>
  <text x="78" y="58" font-family="'Courier New', monospace, sans-serif" font-size="11" font-weight="900" fill="#231B15" letter-spacing="3.5">RETRO DINER &amp; EATS</text>
  <!-- Stamp badge on right -->
  <g transform="translate(254, 18)">
    <rect x="0" y="0" width="46" height="24" rx="6" fill="#588157" stroke="#231B15" stroke-width="2.5"/>
    <text x="23" y="16" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="900" fill="#FAF3E0">EST. '74</text>
  </g>
</svg>